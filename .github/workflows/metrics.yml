# Full option reference: https://github.com/lowlighter/metrics#-documentation
name: metrics
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: profile-update-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: lowlighter/metrics@v3.34
        with:
          # GH_PAT scopes: read:user, read:org, repo (repo is needed for traffic).
          token: ${{ secrets.GH_PAT }}
          # Save through git below; the API save path can lose the existing file SHA.
          output_action: none

          user: martybytes
          repositories_batch: 25
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Chicago
          plugin_gists: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_traffic: yes
          plugin_wakatime: yes
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors-graphs, os-graphs
          plugin_wakatime_languages_ignored: markdown, plaintext, text, xml, yaml, JSON
          plugin_wakatime_days: 365
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}

      - name: Copy rendered metrics
        run: |
          test -s /metrics_renders/github-metrics.svg
          cp /metrics_renders/github-metrics.svg github-metrics.svg

      - name: Commit metrics
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: 'metrics: update github-metrics.svg'
          file_pattern: github-metrics.svg
